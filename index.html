<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EADFCB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Клубок</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <canvas id="board" aria-label="Игровое поле"></canvas>
  <aside id="panel">
    <div class="stat">
      <span class="label">Уровень</span>
      <b id="lvl">1</b>
      <span id="meta" class="meta"></span>
    </div>
    <div id="hearts" aria-label="Жизни">
      <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.7 4.5c2 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.4-2.5 3.7 0 5.9 3.7 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.7 4.5c2 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.4-2.5 3.7 0 5.9 3.7 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.7 4.5c2 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.4-2.5 3.7 0 5.9 3.7 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="spacer"></div>
    <button class="icon" id="btn-zoom-in" title="Приблизить (+)" aria-label="Приблизить">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>
    </button>
    <button class="icon" id="btn-zoom-out" title="Отдалить (−)" aria-label="Отдалить">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
    </button>
    <button class="icon" id="btn-fit" title="Показать всё поле (0)" aria-label="Показать всё поле">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon" id="btn-restart" title="Заново (R)" aria-label="Заново">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="icon" id="btn-theme" title="Тема" aria-label="Тема">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon" id="btn-sound" title="Звук появится позже" aria-label="Звук" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
    </button>
    <button class="icon" id="btn-help" title="Как играть" aria-label="Как играть">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7v.5"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>
    </button>
  </aside>
  <div id="level-flash" aria-hidden="true"></div>
  <pre id="debug" hidden></pre>
  <div id="toast" hidden></div>
  <div id="overlay" hidden>
    <div class="card">
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="row">
        <button id="ov-btn2" class="secondary" hidden></button>
        <button id="ov-btn" class="primary"></button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
